<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Website Studio workflow</title>
  <desc id="desc">An original diagram showing a website request moving through routing, design, implementation, verification, and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#111d2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="0.5" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#c7f464"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="28" fill="url(#grid)"/>
  <circle cx="1440" cy="-10" r="330" fill="#6d5ef3" opacity="0.13"/>
  <circle cx="1520" cy="90" r="170" fill="#66d9ef" opacity="0.09"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="58" width="56" height="56" rx="12" fill="#ff6b35"/>
    <text x="104" y="94" fill="#07111d" font-size="22" font-weight="800" text-anchor="middle">WS</text>
    <text x="150" y="83" fill="#f6f2e9" font-size="16" font-weight="700" letter-spacing="3">WEBSITE STUDIO</text>
    <text x="150" y="106" fill="#a9b7c7" font-size="12" letter-spacing="2">PORTABLE AGENT SKILL</text>

    <text x="76" y="214" fill="#f6f2e9" font-size="72" font-weight="800" letter-spacing="-3">BUILD THE WHOLE SITE.</text>
    <text x="80" y="263" fill="#a9b7c7" font-size="22">Discovery, design direction, implementation, QA, and hosting handoff.</text>
    <rect x="80" y="295" width="620" height="4" rx="2" fill="url(#accent)"/>

    <g transform="translate(1160 66)">
      <rect width="332" height="194" rx="18" fill="#0c1624" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="24" y="34" fill="#7f90a3" font-size="11" font-weight="700" letter-spacing="2">STUDIO INVENTORY</text>
      <g font-size="34" font-weight="800" fill="#f6f2e9">
        <text x="24" y="86">8</text><text x="176" y="86">4</text>
        <text x="24" y="154">4</text><text x="176" y="154">6</text>
      </g>
      <g font-size="11" fill="#a9b7c7" letter-spacing="1.4">
        <text x="62" y="84">RECIPES</text><text x="214" y="84">CAPABILITIES</text>
        <text x="62" y="152">ADAPTERS</text><text x="214" y="152">VALIDATORS</text>
      </g>
      <path d="M164 50V172M18 116H314" stroke="#ffffff" stroke-opacity="0.1"/>
    </g>

    <text x="80" y="377" fill="#7f90a3" font-size="11" font-weight="700" letter-spacing="2.4">ONE EVIDENCE-DRIVEN DELIVERY CHAIN</text>

    <g transform="translate(80 410)">
      <path d="M208 99H278M496 99H566M784 99H854M1072 99H1142" stroke="#718197" stroke-width="2" stroke-dasharray="7 8"/>
      <path d="M264 91L278 99L264 107M552 91L566 99L552 107M840 91L854 99L840 107M1128 91L1142 99L1128 107" fill="none" stroke="#718197" stroke-width="2"/>

      <g>
        <rect width="208" height="198" rx="18" fill="#101d2b" stroke="#ff6b35"/>
        <circle cx="28" cy="28" r="7" fill="#ff6b35"/>
        <text x="46" y="33" fill="#ff9a74" font-size="11" font-weight="700" letter-spacing="2">01 / ROUTE</text>
        <text x="24" y="82" fill="#f6f2e9" font-size="24" font-weight="800">Understand</text>
        <text x="24" y="112" fill="#f6f2e9" font-size="24" font-weight="800">the job.</text>
        <text x="24" y="154" fill="#8fa0b2" font-size="13">Brief · Recipe · Path</text>
      </g>

      <g transform="translate(288)">
        <rect width="208" height="198" rx="18" fill="#101d2b" stroke="#f7c948"/>
        <circle cx="28" cy="28" r="7" fill="#f7c948"/>
        <text x="46" y="33" fill="#f8d979" font-size="11" font-weight="700" letter-spacing="2">02 / DESIGN</text>
        <text x="24" y="82" fill="#f6f2e9" font-size="24" font-weight="800">Choose with</text>
        <text x="24" y="112" fill="#f6f2e9" font-size="24" font-weight="800">intent.</text>
        <text x="24" y="154" fill="#8fa0b2" font-size="13">3 options · 1 decision</text>
      </g>

      <g transform="translate(576)">
        <rect width="208" height="198" rx="18" fill="#101d2b" stroke="#66d9ef"/>
        <circle cx="28" cy="28" r="7" fill="#66d9ef"/>
        <text x="46" y="33" fill="#8fe5f4" font-size="11" font-weight="700" letter-spacing="2">03 / BUILD</text>
        <text x="24" y="82" fill="#f6f2e9" font-size="24" font-weight="800">Implement</text>
        <text x="24" y="112" fill="#f6f2e9" font-size="24" font-weight="800">real states.</text>
        <text x="24" y="154" fill="#8fa0b2" font-size="13">Content · UX · Capability</text>
      </g>

      <g transform="translate(864)">
        <rect width="208" height="198" rx="18" fill="#101d2b" stroke="#c7f464"/>
        <circle cx="28" cy="28" r="7" fill="#c7f464"/>
        <text x="46" y="33" fill="#d9f98d" font-size="11" font-weight="700" letter-spacing="2">04 / VERIFY</text>
        <text x="24" y="82" fill="#f6f2e9" font-size="24" font-weight="800">Prove the</text>
        <text x="24" y="112" fill="#f6f2e9" font-size="24" font-weight="800">experience.</text>
        <text x="24" y="154" fill="#8fa0b2" font-size="13">Build · Browser · Access</text>
      </g>

      <g transform="translate(1152)">
        <rect width="288" height="198" rx="18" fill="#f6f2e9"/>
        <circle cx="28" cy="28" r="7" fill="#6d5ef3"/>
        <text x="46" y="33" fill="#6d5ef3" font-size="11" font-weight="700" letter-spacing="2">05 / HANDOFF</text>
        <text x="24" y="82" fill="#07111d" font-size="24" font-weight="800">Verified URL</text>
        <text x="24" y="112" fill="#07111d" font-size="24" font-weight="800">or honest boundary.</text>
        <rect x="24" y="144" width="240" height="30" rx="15" fill="#e7e2d8"/>
        <circle cx="42" cy="159" r="5" fill="#46a46c"/>
        <text x="56" y="163" fill="#44515f" font-size="11" font-weight="700" letter-spacing="1">EVIDENCE ATTACHED</text>
      </g>
    </g>

    <text x="80" y="710" fill="#718197" font-size="12" letter-spacing="1.4">RECIPES SHAPE THE EXPERIENCE · CAPABILITIES SHAPE THE BACKEND · ADAPTERS SHAPE EXECUTION</text>
  </g>
</svg>
