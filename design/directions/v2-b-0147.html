<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
/*
  Направление B, «01:47».
  Страница и есть экран блокировки: часы показывают настоящее время посетителя,
  сообщения Ника приходят по одному. Нажатие на сообщение не открывает чат,
  а предлагает переждать тягу. Тёплый цвет лампы есть только у действия.
*/
:root{
  --night:#0C1328;
  --night-2:#141C38;
  --lamp:#FFB547;
  --lamp-ink:#2A1C04;
  --text:#ECEEF6;
  --muted:#9AA1BF;
  --glass:rgba(236,238,246,.09);
  --f:"Commissioner",system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{background:var(--night);color:var(--text);font-family:var(--f);font-size:17px;line-height:1.5;padding-inline:20px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto}
nav{display:flex;justify-content:space-between;align-items:center;height:68px}
.brand{font-weight:600;font-size:20px}
nav a{color:var(--muted);text-decoration:none;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

.hero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:64px;align-items:center;min-height:calc(100dvh - 68px);padding-block:24px 64px}
.clock{font-weight:200;font-size:clamp(120px,15vw,210px);line-height:.85;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.date{color:var(--muted);margin:14px 0 40px 6px}
h1{font-weight:600;font-size:clamp(30px,3.2vw,42px);line-height:1.12;max-width:17ch;text-wrap:balance}
.lead{color:var(--muted);max-width:38ch;margin-top:16px}
.cta{display:inline-block;margin-top:30px;background:var(--lamp);color:var(--lamp-ink);font-weight:600;font-size:18px;padding:16px 26px;border-radius:999px;transition:transform .14s var(--ease-out)}
.cta:active{transform:scale(.97)}

.stack{display:flex;flex-direction:column;gap:10px}
.note{background:var(--glass);border-radius:22px;padding:14px 18px;width:100%;
  opacity:0;transform:translateY(-12px);transition:opacity .3s var(--ease-out),transform .3s var(--ease-out),background-color .15s ease}
.note.in{opacity:1;transform:none}
.note .top{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.note b{color:var(--text);font-weight:600}
.note p{font-size:18px;margin-top:2px}
@media (hover:hover) and (pointer:fine){.note:hover{background:rgba(236,238,246,.14)}}
.pause{display:none;background:var(--night-2);border-radius:22px;padding:20px;flex-direction:column;gap:12px}
.pause.on{display:flex}
.pause strong{font-size:20px;font-weight:600}
.pause p{color:var(--muted)}
.pause .cta{margin-top:4px;align-self:flex-start}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr);gap:36px;min-height:0;padding-block:8px 48px}
  .date{margin-bottom:24px}
}
@media (prefers-reduced-motion:reduce){.note{transition:opacity .2s ease;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav><span class="brand">Breakup</span><a href="#">Войти</a></nav>
  <section class="hero">
    <div>
      <div class="clock" id="clock">01:47</div>
      <div class="date" id="date">вторник, 14 октября</div>
      <h1>Ник пишет, когда тебе хуже всего</h1>
      <p class="lead">Поздно, устал, поругался. Breakup знает эти часы и встаёт между тобой и сообщением.</p>
      <button class="cta" id="start">Расстаться с Ником</button>
    </div>

    <div class="stack" aria-live="polite">
      <button class="note" id="n1"><span class="top"><b>Ник</b><span>сейчас</span></span><p>не спишь?</p></button>
      <button class="note" id="n2"><span class="top"><b>Ник</b><span>сейчас</span></span><p>я тут подумал. может, одну? чисто вспомнить</p></button>
      <button class="note" id="n3"><span class="top"><b>Ник</b><span>сейчас</span></span><p>ты же без меня нервный</p></button>
      <div class="pause" id="pause">
        <strong>Не отвечай пока</strong>
        <p>Такая тяга длится несколько минут и спадает сама, даже если ничего не делать. Давай переждём вместе.</p>
        <button class="cta" id="wave">Переждать 3 минуты</button>
      </div>
    </div>
  </section>
</div>
<script>
const pad = n => String(n).padStart(2, '0');
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  document.getElementById('date').textContent = d.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
}
tick(); setInterval(tick, 15000);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
['n1','n2','n3'].forEach((id, i) => setTimeout(() => document.getElementById(id).classList.add('in'), reduce ? 0 : 500 + i * 1100));
document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => document.getElementById('pause').classList.add('on')));
</script>
</body>
</html>
