<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@800&display=swap" rel="stylesheet">
<style>*{margin:0}body{width:1200px;height:630px;overflow:hidden;font-family:Geologica,sans-serif;background:linear-gradient(180deg,#1E9BEA 0%,#4EC0F4 60%,#BFEAFB 100%);position:relative;color:#06243F}
.sun{position:absolute;left:900px;top:60px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 45% 42%,#FFE08A,#FFC94D 55%,#F5B23E)}
.glow{position:absolute;left:720px;top:-110px;width:610px;height:610px;border-radius:50%;background:radial-gradient(circle closest-side,rgba(255,201,77,.45),rgba(255,201,77,.15) 45%,transparent)}
svg{position:absolute;left:610px;top:150px}
h1{position:absolute;left:72px;bottom:72px;font-size:96px;line-height:.9;letter-spacing:-.05em;font-weight:800;width:560px}
.b{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-size:36px;letter-spacing:-.03em;font-weight:800}
</style></head><body>
<div class="glow"></div><div class="sun"></div>
<svg width="700" height="360" viewBox="0 0 700 360"><defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="330"><stop offset="0" stop-color="#9C8A5C"/><stop offset="1" stop-color="#4A412A"/></linearGradient>
<radialGradient id="r" cx="470" cy="10" r="320" gradientUnits="userSpaceOnUse"><stop offset=".2" stop-color="#FFE08A" stop-opacity=".9"/><stop offset=".55" stop-color="#FFC94D" stop-opacity=".3"/><stop offset="1" stop-color="#FFC94D" stop-opacity="0"/></radialGradient>
<clipPath id="base"><rect x="0" y="0" width="700" height="318"/></clipPath>
<mask id="m"><g fill="#fff" clip-path="url(#base)"><circle cx="110" cy="285" r="78"/><circle cx="215" cy="240" r="104"/><circle cx="340" cy="215" r="118"/><circle cx="460" cy="150" r="118"/><circle cx="565" cy="225" r="104"/><circle cx="655" cy="275" r="80"/><circle cx="400" cy="270" r="110"/></g></mask></defs>
<g mask="url(#m)"><rect width="700" height="360" fill="url(#g)"/><rect width="700" height="360" fill="url(#r)"/></g></svg>
<div class="b"><svg width="40" height="40" viewBox="0 0 28 28" style="position:static"><circle cx="17" cy="11" r="8" fill="#FFC94D"/><path d="M3.5 22.5a4.5 4.5 0 0 1 4.2-4.5 6 6 0 0 1 11.3 1.1 3.7 3.7 0 0 1-.4 7.4H7.9a4.4 4.4 0 0 1-4.4-4z" fill="#4A412A"/></svg>Breakup</div>
<h1>Пора расстаться с&nbsp;Ником</h1>
</body></html>
